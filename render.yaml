services:
  # 1. NestJS Docker Web Service
  - type: web
    name: escrow-marketplace-api
    runtime: docker
    plan: free
    region: singapore # Change to match your Supabase region if desired (e.g. singapore, oregon, frankfurt)
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Set this in Render Dashboard -> Environment or let Render prompt during Blueprint setup
      - key: DATABASE_URL
        sync: false
      # Automatically wires the internal connection string of the Valkey/Redis instance below
      - key: REDIS_URL
        fromService:
          type: redis
          name: escrow-valkey
          property: connectionString

  # 2. Render Valkey / Redis Instance
  - type: redis
    name: escrow-valkey
    plan: free
    region: singapore
    ipAllowList: [] # Private network only (accessible by your web service)
